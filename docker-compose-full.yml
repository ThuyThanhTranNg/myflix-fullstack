version: '3.8'

services:
  # 1. Frontend Service (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uda_cloud_frontend
    ports:
      - "80:80"
      - "3000:80" # Nginx phục vụ frontend ở cả port 80 và port 3000
    depends_on:
      - backend
    restart: always

  # 2. Backend Service (Node.js/Express + MongoDB)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uda_cloud_backend
    ports:
      - "5000:8080"
      - "8080:8080" # Express server ở cả port 8080 và port 5000
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo_db:27017/myflix_db
    depends_on:
      - mongo_db
    restart: always

  # 3. Database Service (MongoDB)
  mongo_db:
    image: mongo:7.0
    container_name: uda_cloud_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
