name: CI/CD - MyFlix Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'tranthuy2312' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'tranthuy2312' }}/myflix-frontend:latest
            ${{ secrets.DOCKER_USERNAME || 'tranthuy2312' }}/myflix-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME || 'tranthuy2312' }}/myflix:latest
            ${{ secrets.DOCKER_USERNAME || 'tranthuy2312' }}/myflix:${{ github.sha }}
