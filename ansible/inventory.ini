# 1. Nhóm chạy trên máy Local / WSL:
[myflix_local]
localhost ansible_connection=local

# 2. Nhóm chạy trên AWS EC2:
[myflix_aws]
ec2-server ansible_host=13.211.179.246 ansible_user=ubuntu ansible_ssh_private_key_file="D:/DuAn/myflix-key.pem.pem" ansible_ssh_common_args='-o StrictHostKeyChecking=no'

