services:
  frontend:
    image: tranthuy2312/myflix-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    image: tranthuy2312/myflix-backend:latest
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=myflix_db
    depends_on:
      - mysql_db
    restart: always

  mysql_db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=myflix_db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data: