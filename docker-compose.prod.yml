services:
  frontend:
    image: tranthuy2312/myflix-frontend:latest
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    image: tranthuy2312/myflix-backend:latest
    ports:
      - "5000:8080"
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo_db:27017/myflix_db
    depends_on:
      - mongo_db
    restart: always

  mongo_db:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data: